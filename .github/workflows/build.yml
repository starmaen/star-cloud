name: Build Star Cloud APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" || true
          sdkmanager "platforms;android-36.1" || sdkmanager "platforms;android-36" || true
          sdkmanager "build-tools;36.1.0" || sdkmanager "build-tools;36.0.0" || true

      - name: Print signing fingerprints
        run: |
          keytool -list -v -keystore keystore.jks -storepass "AlMustasharStore2026" -alias al-mustashar | grep -E "SHA1:|SHA256:" || true

      - name: Build debug APK
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Star-Cloud-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Star Cloud - latest build" --notes "أحدث نسخة من Star Cloud: نسخ احتياطي واستعادة للتطبيقات والملفات وجهات الاتصال والرسائل، إلى مجلد أو Google Drive أو WebDAV." || true
          gh release view latest >/dev/null 2>&1 || { echo "Release 'latest' غير متاح"; exit 1; }
          gh release delete-asset latest Star_Cloud.apk -y >/dev/null 2>&1 || true
          gh release delete-asset latest app-debug.apk -y >/dev/null 2>&1 || true
          gh release upload latest app/build/outputs/apk/debug/app-debug.apk
          ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.assets[] | select(.name=="app-debug.apk") | .id' | head -n1)
          if [ -n "$ASSET_ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" -f name=Star_Cloud.apk >/dev/null
          fi